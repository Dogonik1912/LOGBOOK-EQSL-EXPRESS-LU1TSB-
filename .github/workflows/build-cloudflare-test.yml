name: Cloudflare compatibility build

on:
  push:
    branches:
      - cloudflare-compat-test-2026-10-24
  pull_request:
    branches:
      - main
      - cloudflare-compat-test-2026-10-24
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        run: npm run build
      - name: Bundle Cloudflare Pages Functions
        run: npx --yes wrangler@latest pages functions build functions --outdir .wrangler/functions
      - name: Confirm output exists
        run: test -s dist/index.html
